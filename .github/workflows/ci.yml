name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: stacked pull requests target another feature branch
  # rather than main, and would otherwise get no CI at all.
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
